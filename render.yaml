services:
  - type: web
    name: edunotas-api
    runtime: node
    plan: free
    buildCommand: bun install --frozen-lockfile && bunx prisma generate
    preDeployCommand: bun run db:migrate:deploy
    startCommand: bun run start
    initialDeployHook: bun run db:seed
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: BUN_VERSION
        value: 1.4.0
      - key: DATABASE_URL
        fromDatabase:
          name: edunotas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://edunotas-web.onrender.com
      - key: TEACHER_NAME
        sync: false
      - key: TEACHER_EMAIL
        sync: false
      - key: TEACHER_PASSWORD
        sync: false

databases:
  - name: edunotas-db
    plan: free
    databaseName: edunotas
    user: edunotas
    postgresMajorVersion: "17"
