services:
  - type: web
    name: edunotas-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    initialDeployHook: bun run db:seed
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edunotas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://edunotas-web.onrender.com
      - key: TEACHER_NAME
        sync: false
      - key: TEACHER_EMAIL
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: SEED_SAMPLE_STUDENTS
        value: "false"

databases:
  - name: edunotas-db
    plan: free
    databaseName: edunotas
    user: edunotas
    postgresMajorVersion: "17"
